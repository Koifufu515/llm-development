t:340px;margin-bottom:15px;background:#edf1e8;border:1px solid var(--line);border-radius:12px}#map>svg{width:100%;height:100%}@media(max-width:1100px){.layout{grid-template-columns:190px 1fr}.right{display:none}.right.show{display:block;position:fixed;right:0;top:70px;bottom:0;width:345px;box-shadow:-15px 0 60px #193e3b22}}@media(max-width:650px){.layout{grid-template-columns:1fr}aside{display:none}.brand small{display:none}header{padding:0 16px}#messages{padding:18px}.compose{padding:12px}.poilist{grid-template-columns:1fr}}

<header><div class="brand">知行<small>让下一段旅程，有迹可循。</small></div><div><button onclick="document.querySelector('.right').classList.toggle('show')">旅行需求</button> <button onclick="showPlans()">我的行程</button> <button onclick="showMemory()">我的偏好</button> <button onclick="logout()">退出</button></div></header>
<div class="layout"><aside><button class="primary" style="width:100%" onclick="newConv()">＋ 规划新旅程</button><p class="muted">旅行记录</p><div id="convs"></div><p class="muted" id="account"></p></aside><main><div class="state" id="state">准备出发</div><div id="messages"><div class="welcome"><span class="tag">YOUR NEXT JOURNEY</span><h1>从一个想法，<br>到一份可以出发的行程。</h1><p class="muted">告诉知行你的目的地和偏好，或从右侧填写需求。交通、住宿与预算会逐项呈现。</p></div></div><div class="compose"><textarea id="text" placeholder="例如：确认；或把第二站改成南京……"></textarea><button class="primary" id="send" onclick="chat()">发送 ↗</button></div></main><section class="right"><h2>这次，想去哪里？</h2><div class="muted">每段交通与每站住宿都能自行选择。</div><form id="requirement" onsubmit="startPlan(event)"><label>出发城市<input id="departure" list="cityOptions" value="上海" required></label><datalist id="cityOptions"></datalist><label>目的地 · 多城用顿号分开<input id="destinations" value="苏州" placeholder="留空由 AI 推荐"></label><div class="two"><label>出发日期<input type="date" id="date" required></label><label>旅行天数<input type="number" id="days" min="1" max="30" value="2" required></label></div><div class="two"><label>成人<input type="number" id="adults" min="1" max="20" value="1"></label><label>儿童<input type="number" id="children" min="0" max="20" value="0"></label></div><label>每人预算上限 · 元，0 表示不限<input id="budget" type="number" min="0" value="3000"></label><label>首选交通<select id="transport"><option value="train">高铁 / 动车</option><option value="flight">航班</option><option value="driving">自驾</option></select></label><label>住宿偏好<select id="hotel"><option value="economy_hotel">经济型酒店</option><option value="star_hotel">星级酒店</option><option value="hostel">特色民宿</option><option value="youth_hostel">青年旅舍</option></select></label><label>旅行风格<input id="styles" value="文化探索、美食" placeholder="文化、亲子、美食、休闲"></label><label>特殊需求<input id="needs" placeholder="例如海鲜过敏、轻松一些"></label><label><input type="checkbox" id="auto"> 全程由 AI 代选交通与住宿</label><div class="form-actions"><button class="primary" id="planButton">开始规划 ↗</button></div><p class="muted">实时查询失败会明确提示；报价仅供参考。此应用生成旅行计划，不执行订票或订房。</p></form></section></div>
<dialog class="auth" id="auth"><h1>欢迎来到知行</h1><div class="muted">登录后保存你的旅程和偏好。</div><label>邮箱<input type="email" id="email" autocomplete="username"></label><label>密码<input type="password" id="password" minlength="8" autocomplete="current-password" placeholder="至少 8 个字符"></label><div class="form-actions"><button onclick="authenticate('register')">注册</button><button class="primary" onclick="authenticate('login')">登录</button></div><p class="muted" id="authError"></p></dialog>
<dialog id="detail"><button style="float:right" onclick="this.closest('dialog').close()">关闭 ×</button><div id="detailBody"></div></dialog>
<script>
let token=localStorage.getItem('knowgo_token'),cid=null,busy=false;const $=id=>document.getElementById(id);$('date').value=new Date(Date.now()+86400000).toISOString().slice(0,10);
function escapeText(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function format(t){const lines=escapeText(t).split('\n'),out=[];for(let i=0;i<lines.length;i++){if(lines[i].startsWith('|')&&/^\|[\s:|\-]+\|$/.test(lines[i+1]||'')){let table='<table>';const row=(line,tag)=>'<tr>'+line.split('|').slice(1,-1).map(v=>'<'+tag+'>'+v.trim()+'</'+tag+'>').join('')+'</tr>';table+=row(lines[i],'th');i+=2;for(;i<lines.length&&lines[i].startsWith('|');i++)table+=row(lines[i],'td');i--;out.push(table+'</table>');}else out.push(lines[i]);}return out.join('\n').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
async function api(path,options={}){const r=await fetch('/api/v1'+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}});if(!r.ok){const e=await r.json();if(r.status===401)$('auth').showModal();throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail));}return r;}
function bubble(t,role='assistant'){const d=document.createElement('div');d.className='bubble '+role;d.innerHTML=format(t);$('messages').append(d);d.scrollIntoView({block:'end'});return d;}
function setBusy(v){busy=v;$('send').disabled=v;$('planButton').disabled=v;}
async function authenticate(kind){try{const r=await fetch('/api/v1/users/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'请检查邮箱和密码格式');token=data.access_token;localStorage.setItem('knowgo_token',token);$('password').value='';$('auth').close();await init();}catch(e){$('authError').textContent=e.message;}}
function logout(){localStorage.removeItem('knowgo_token');location.reload();}
async function init(){if(!token){$('auth').showModal();return;}try{const me=await(await api('/users/me')).json();$('account').textContent=me.email;await listConvs();const cities=await(await api('/cities')).json();$('cityOptions').replaceChildren(...cities.items.map(c=>{const o=document.createElement('option');o.value=c.name;o.label=c.province;return o;}));}catch(e){$('authError').textContent=e.message;}}
async function listConvs(){const data=await(await api('/conversations')).json();$('convs').replaceChildren();for(const c of data.items){const d=document.createElement('div');d.className='conv'+(cid===c.id?' active':'');const s=document.createElement('span');s.textContent=c.title;s.onclick=()=>openConv(c.id);const b=document.createElement('button');b.textContent='×';b.onclick=async()=>{if(confirm('删除这条旅行记录？')){await api('/conversations/'+c.id,{method:'DELETE'});if(cid===c.id){cid=null;$('messages').replaceChildren();}await listConvs();}};d.append(s,b);$('convs').append(d);}}
async function newConv(){if(busy)return;const row=await(await api('/conversations',{method:'POST',body:JSON.stringify({title:$('departure').value+'的下一段旅行'})})).json();cid=row.id;$('messages').replaceChildren();$('state').textContent='需求收集';await listConvs();return cid;}
async function openConv(id){if(busy)return;cid=id;$('messages').replaceChildren();const rows=await(await api('/messages?conversation_id='+id)).json();const state=await updateState();const rendered=new Set();for(const m of rows.items){bubble(m.extra.original||m.content,m.role);if(m.extra.skill_ui){const c=m.extra.skill_ui;c.is_current=c.revision===state.revision;card(c);rendered.add(c.id);}if(m.extra.itinerary_plans)planLink(m.extra.itinerary_plans);}if(state.active_card&&!rendered.has(state.active_card.id)){const c=await(await api('/cards/'+state.active_card.id)).json();card(c);}await listConvs();}
async function updateState(){if(!cid)return;const c=await(await api('/conversations/'+cid)).json();const labels={requirement_collection:'需求收集',destination_recommendation:'目的地确认',transport_planning:'交通选择',accommodation_planning:'住宿选择',food_planning:'餐饮偏好',itinerary_generation:'生成行程',budget_summarization:'行程已保存'};$('state').textContent=(labels[c.state.current_step]||c.state.current_step)+' · 需求版本 '+c.state.revision;return c.state;}
async function consume(path,body){setBusy(true);try{const r=await api(path,{method:'POST',body:JSON.stringify(body)}),reader=r.body.getReader(),decoder=new TextDecoder();let buf='',assistantText='',assistantBubble=null;while(true){const {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});let pos;while((pos=buf.indexOf('\n\n'))>=0){const frame=buf.slice(0,pos);buf=buf.slice(pos+2);const line=frame.split('\n').find(l=>l.startsWith('data: '));if(!line)continue;const e=JSON.parse(line.slice(6));if(e.role==='assistant'){assistantText+=e.content;if(!assistantBubble)assistantBubble=bubble('');assistantBubble.innerHTML=format(assistantText);assistantBubble.scrollIntoView({block:'end'});}if(e.role==='assistant_reset'){assistantText='';if(assistantBubble)assistantBubble.remove();assistantBubble=null;}if(e.role==='error')bubble(e.content,'error');if(e.role==='skills')$('state').textContent=e.content.title+' · '+e.content.desc;if(e.role==='skill_ui')card(e.content);if(e.role==='itinerary_plans')planLink(e.content);}}}catch(e){bubble(e.message,'error');}finally{setBusy(false);await updateState();await listConvs();}}
async function chat(){if(busy||!$('text').value.trim())return;if(!cid)await newConv();const text=$('text').value;$('text').value='';bubble(text,'user');await consume('/messages',{conversation_id:cid,content:text});}
async function startPlan(e){e.preventDefault();if(busy)return;if(!cid)await newConv();const req={departure_city:$('departure').value.trim(),destinations:$('destinations').value.split(/[、，,]/).map(s=>s.trim()).filter(Boolean),departure_date:$('date').value,travel_days:+$('days').value,adult_count:+$('adults').value,children_count:+$('children').value,budget_max:+$('budget').value,transport_types:[$('transport').value],accommodation_types:[$('hotel').value],food_preferences:['local','specialty'],travel_styles:$('styles').value.split(/[、，,]/).filter(Boolean),special_needs:$('needs').value,auto_confirm:$('auto').checked};bubble('旅行需求：'+req.departure_city+' → '+(req.destinations.join(' → ')||'由 AI 推荐')+'，'+req.travel_days+'天','user');await consume('/conversations/'+cid+'/requirement',req);}
function card(c){const d=document.createElement('div');d.className='card';const title=document.createElement('h2');title.textContent=c.skill_name==='hotel_multi_segment'?'选择各站住宿':'选择各段交通';d.append(title);const form=document.createElement('form'),segments=c.data.segments;for(const s of segments){const section=document.createElement('div');section.className='segment';const head=document.createElement('strong');head.textContent=s.city?`${s.city} · ${s.checkin} 至 ${s.checkout}`:`${s.from} → ${s.to} · ${s.date}`;section.append(head);if(!s.options.length){const note=document.createElement('p');note.className='muted';note.textContent=s.message||'该段暂无候选，将保留待核实。';section.append(note);}for(const o of s.options){const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name=s.segment_id;input.value=o.option_id;const selectable=o.mode!=='train'||/^(有|有票|[1-9]\d*(张)?)$/.test(o.availability||'');input.required=selectable;input.disabled=!!c.submitted||c.is_current===false||!selectable;const info=document.createElement('div');info.textContent=o.name;const detail=document.createElement('small');detail.textContent=o.nights?`${o.mode==='brand'?'品牌参考 · 无门店报价':(o.nightly_price_yuan==null?'房价待核实':o.nightly_price_yuan+'元/晚')} · ${o.address||''}`:o.mode==='driving'?`${o.distance_km}公里 · ${o.duration_minutes}分钟 · 过路费${o.tolls_yuan??'未知'}元`:`${o.mode==='flight'?(o.from_airport||'')+' → '+(o.to_airport||'')+' · ':o.mode==='train'?(o.from_station||'')+' → '+(o.to_station||'')+' · ':''}${o.departure_time||''} → ${o.arrival_time||''}${o.arrival_date&&o.arrival_date!==o.date?' ('+o.arrival_date+')':''} · ${o.price_yuan==null?'票价待定':o.price_yuan+'元'} · ${o.availability||''}`;info.append(detail);label.append(input,info);section.append(label);if(c.submitted?.selections?.some(x=>x.segment_id===s.segment_id&&x.option_id===o.option_id))input.checked=true;}form.append(section);}const button=document.createElement('button');button.className='primary';button.textContent=c.is_current===false?'旧需求或候选已过期':c.submitted?'已提交并保存':'确认全部选择';button.disabled=!!c.submitted||c.is_current===false;form.append(button);form.onsubmit=async e=>{e.preventDefault();if(busy)return;const selections=segments.filter(s=>s.options.some(o=>o.mode!=='train'||/^(有|有票|[1-9]\d*(张)?)$/.test(o.availability||''))).map(s=>({segment_id:s.segment_id,option_id:new FormData(form).get(s.segment_id)}));await consume('/skills/'+c.skill_name+'/submit',{conversation_id:cid,card_id:c.id,revision:c.revision,selections});await openConv(cid);};d.append(form);$('messages').append(d);d.scrollIntoView({block:'end'});}
function planLink(p){if(p.status!=='success')return;const b=document.createElement('button');b.className='primary';b.textContent='查看完整行程与地图 ↗';b.onclick=()=>showPlan(p.id);$('messages').append(b);}
async function showPlans(){const rows=await(await api('/plans')).json();$('detailBody').replaceChildren();for(const p of rows.items){const b=document.createElement('button');b.textContent=p.title;b.style.display='block';b.style.margin='10px 0';b.onclick=()=>showPlan(p.id);$('detailBody').append(b);}if(!rows.items.length)$('detailBody').textContent='还没有保存的行程。';$('detail').showModal();}
async function showPlan(id){const p=await(await api('/plans/'+id)).json();$('detailBody').innerHTML='<h1>'+escapeText(p.title)+'</h1><div id="map"></div><div class="poilist" id="pois"></div><div id="planText"></div>';renderBudget(p.budget,$('planText'));if(p.is_current===false){const n=document.createElement('p');n.className='notice';n.textContent='这是修改需求前保存的行程，请继续完成当前版本。';$('planText').prepend(n);}for(const day of p.body.days){const h=document.createElement('h2');h.textContent='Day '+day.day+' · '+day.city;$('planText').append(h);for(const k of ['morning','noon','afternoon','evening'])for(const a of day[k]){const text=document.createElement('p');text.textContent=a.start_time+' '+a.name+'：'+a.description;$('planText').append(text);}}renderSources(p.map_data.sources||[],$('planText'));const points=p.map_data.points||[];if(points.length){const xs=points.map(x=>x.lng),ys=points.map(x=>x.lat),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);let svg='<svg viewBox="0 0 700 340" role="img" aria-label="行程地点示意图"><text x="20" y="28" fill="#61786d" font-size="13">地点分布 · GCJ02 · 连线为地点顺序示意</text>';const xy=points.map(p=>[40+(p.lng-minx)/(maxx-minx||1)*620,285-(p.lat-miny)/(maxy-miny||1)*220]);svg+='<polyline points="'+xy.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#86ad92" stroke-width="2"/>';points.forEach((p,i)=>{svg+=`<circle cx="${xy[i][0]}" cy="${xy[i][1]}" r="7" fill="#126b59"/><text x="${xy[i][0]+10}" y="${xy[i][1]}" font-size="11" fill="#193e3b">${escapeText(p.name)}</text>`;const d=document.createElement('div');d.className='poi';if(p.photo_url){const img=document.createElement('img');img.src=p.photo_url;img.alt=p.name;img.onerror=()=>img.remove();img.loading='lazy';d.append(img);}const a=document.createElement('a');a.href='https://uri.amap.com/marker?position='+p.lng+','+p.lat+'&name='+encodeURIComponent(p.name);a.target='_blank';a.rel='noopener';a.textContent=p.name+' · 在高德查看';d.append(a);$('pois').append(d);});$('map').innerHTML=svg+'</svg>';}else $('map').textContent='本次地图地点未获取到，完整行程仍可查看。';if(!$('detail').open)$('detail').showModal();if(points.length)drawTravelMap(p.map_data);}
function renderBudget(b,target){
 const h=document.createElement('h2');h.textContent='预算 · 合计 '+b.total+' 元 / 人均 '+b.per_person+' 元';target.append(h);
 if(b.over_budget){const n=document.createElement('p');n.className='notice';n.textContent='当前参考预算超过每人预算上限 '+b.budget_max+' 元，可调整交通或住宿后重新生成。';target.append(n);}
 const table=document.createElement('table');for(const row of [['项目','数量','单价','小计','依据'],...b.items.map(r=>[r.label,r.quantity+r.unit,r.unit_price+'元',r.amount+'元',r.basis==='quote'?'查询参考价':'估算'])]){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value;tr.append(td);}table.append(tr);}target.append(table);const n=document.createElement('p');n.className='muted';n.textContent=b.notice+' 查询价 '+b.quote_total+' 元；估算 '+b.estimate_total+' 元。';target.append(n);
}
function renderSources(rows,target){if(!rows.length)return;const details=document.createElement('details');details.className='sources';const h=document.createElement('summary');h.textContent='资料来源与时效说明 · '+rows.length+' 段';details.append(h);for(const r of rows){const p=document.createElement('p'),a=document.createElement('a');if(/^https?:\/\//.test(r.source_url||'')){a.href=r.source_url;a.target='_blank';a.rel='noopener';}a.textContent=r.city+' · '+r.title;p.append(a);p.append(document.createTextNode(' — '+r.freshness+' · '+r.license));details.append(p);}target.append(details);}
async function showMemory(){const memory=await(await api('/memory')).json();$('detailBody').replaceChildren();const h=document.createElement('h1');h.textContent='我的长期偏好';$('detailBody').append(h);const labels={travel_styles:'旅行风格',dietary_restrictions:'饮食禁忌',food_preferences:'餐饮口味',accommodation_preferences:'住宿偏好',travel_history:'已完成出游记录'};for(const [category,title] of Object.entries(labels)){const label=document.createElement('label');label.textContent=title;const input=document.createElement('textarea');input.style.width='100%';input.style.minHeight='75px';input.value=(memory[category]||[]).join('\n');label.append(input);const save=document.createElement('button');save.textContent='保存';save.onclick=async()=>{try{await api('/memory',{method:'PATCH',body:JSON.stringify({category,operation:'replace',values:input.value.split('\n').map(v=>v.trim()).filter(Boolean)})});save.textContent='已保存';}catch(e){save.textContent=e.message;}};$('detailBody').append(label,save);}if(!$('detail').open)$('detail').showModal();}
$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chat();}});$('auth').addEventListener('cancel',e=>e.preventDefault());init();
</script></html>
