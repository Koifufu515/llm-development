[project]
name = "knowgo-travel"
version = "0.1.0"
description = "知行旅行助手：逐步实现的学习项目"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.124.4",
    "uvicorn[standard]>=0.35,<1",
    "langchain==1.2.0",
    "langchain-openai~=1.1.7",
    "langgraph==1.0.5",
    "langgraph-prebuilt==1.0.5",
    "langchain-core~=1.2.7",
    "langgraph-checkpoint-postgres==3.0.2",
    "psycopg[binary,pool]==3.3.2",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",
    "langchain-mcp-adapters==0.2.1",
    "fastmcp==2.13.1",
    "fastembed>=0.7,<0.10",
    "rank-bm25==0.2.2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "pyjwt>=2.10,<3",
    "bcrypt>=4,<6",
    "redis>=5,<7",
    "chromadb>=1,<2",
    "jieba==0.42.1",
    "dashscope>=1.25,<2",
    "langchain-text-splitters>=1,<2",
    "beautifulsoup4>=4.13,<5",
    "deepeval>=3,<5",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2"]
