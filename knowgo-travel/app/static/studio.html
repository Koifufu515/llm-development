<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知行旅行助手</title>
<style>body{font:16px system-ui;background:#f4f7fa;color:#17324d;margin:0}main{max-width:1120px;margin:auto;padding:28px}h1{margin:0 0 8px}section{background:white;border:1px solid #dde6ee;border-radius:14px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}label{display:flex;flex-direction:column;gap:7px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #b8c9d9;border-radius:8px}button{background:#16667a;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#597084}.day{padding:14px;background:#f5f9fb;margin:10px 0;border-radius:9px}.status{color:#136c70}details{margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:14px}}</style>
<main><h1>知行旅行助手</h1><p class="muted">规划多城行程，查看交通、天气和攻略来源，保存旅行偏好。</p>
<section><div class="grid"><label>出发城市<input id="from" value="上海"></label><label>出发日期<input id="date" type="date"></label><label>目的地与停留天数<input id="stops" value="苏州:3" placeholder="苏州:2,杭州:2"></label><label>成人数<input id="adults" type="number" value="1" min="1"></label><label>儿童数<input id="children" type="number" value="0" min="0"></label><label>每人预算上限（元）<input id="budget" type="number" value="2000" min="1"></label><label>每间房每晚估算（元）<input id="hotel" type="number" value="300" min="0"></label><label>每人每天餐饮估算（元）<input id="meal" type="number" value="100" min="0"></label><label>旅行偏好<input id="styles" value="园林,轻松"></label></div>
<p><label style="display:block"><input id="auto" type="checkbox" checked> 我确认以上需求，授权自动选择交通与住宿参考方案并生成行程（不会购票或预订）</label></p><button id="plan">生成旅行计划</button> <button id="new">新会话</button><p id="session" class="muted"></p><p id="status" class="status" aria-live="polite"></p></section>
<section><h2>跨会话偏好</h2><label>节奏<select id="pace"><option>轻松</option><option>适中</option><option>紧凑</option></select></label><p><button id="prefs">保存偏好</button> <button id="history">读取本会话计划</button></p><p id="prefsStatus"></p></section>
<section><h2>对话与直接查询</h2><label>消息<input id="message" placeholder="例如：苏州明天天气怎样；记住我不吃辣"></label><p><button id="send">发送</button></p><pre id="chatReply"></pre></section><section id="result"><p class="muted">生成后将在此显示逐日安排、预算、交通候选与资料来源。</p></section><section><details><summary>查询证据与测量</summary><pre id="evidence"></pre></details><a href="/learn">进入对话与状态学习页</a></section></main>
<script>
const $=id=>document.getElementById(id);let session,user;const date=new Date();date.setDate(date.getDate()+1);$('date').value=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function node(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
async function newSession(){session=(await api('/api/sessions','POST',{user_id:user})).session_id;localStorage.setItem('knowgo-studio-session',session);$('session').textContent='当前会话：'+session}
async function init(){user=localStorage.getItem('knowgo-studio-user');if(user){try{await api('/api/users/'+user+'/preferences')}catch{user=null}}if(!user){user=(await api('/api/users','POST')).user_id;localStorage.setItem('knowgo-studio-user',user)}session=localStorage.getItem('knowgo-studio-session');if(session){try{await api('/api/sessions/'+session)}catch{session=null}}if(!session)await newSession();$('session').textContent='当前会话：'+session;const p=await api('/api/users/'+user+'/preferences');if(p.pace)$('pace').value=p.pace}
function render(data){const root=$('result');root.replaceChildren();if(data.status!=='completed'){node('h2','交通候选已查询，请确认自动规划或返回对话继续选择',root)}else{node('h2','旅行计划',root);node('p',data.itinerary.summary,root);for(const d of data.itinerary.days){const box=node('div','',root);box.className='day';node('h3','第'+d.day+'天 · '+d.city,box);for(const [key,label]of [['morning','上午'],['afternoon','下午'],['evening','晚上'],['notes','提醒']])node('p',label+'：'+d[key],box)}const b=data.budget;node('h2','预算参考',root);node('p','全体预算上限 '+b.party_budget_limit+' 元；已知与估算合计 '+b.known_and_estimated_total+' 元'+(b.over_budget?'（超过上限，请调整）':''),root);node('p','交通参考 '+b.transport_reference_total+'；住宿参考 '+(b.hotel_reference_total||0)+'、住宿估算 '+b.hotel_estimate_total+'；餐饮估算 '+b.food_estimate_total+'。未定价交通段：'+b.unpriced_transport_legs,root);node('p',b.note+' 不包含：'+b.exclusions.join('、'),root)}
node('h2','交通候选',root);const choices={};for(const segment of data.segments||[]){node('h3',segment.requested.fromStation+' → '+segment.requested.toStation+' '+segment.requested.date,root);if(segment.status!=='ok'){node('p',segment.message||'没有可用结果',root);continue}const table=node('table','',root),head=node('tr','',table);for(const h of ['车次','实际到发站','发到时间','席别与价格'])node('th',h,head);for(const row of segment.options){const tr=node('tr','',table);if(data.status==='waiting_selection'){const td=node('td','',tr),radio=document.createElement('input');radio.type='radio';radio.name=segment.leg_id;radio.onchange=()=>choices[segment.leg_id]=row.option_id;td.append(radio)}for(const text of [row.train_code,row.from_station+' → '+row.to_station,row.departure_time+' → '+row.arrival_time,row.seats.map(s=>s.name+' '+s.availability+' '+(s.price_yuan??'未知')+'元').join('；')])node('td',text,tr)}}if(data.status==='waiting_selection'){const submit=node('button','确认所选交通并生成行程',root);submit.onclick=async()=>{submit.disabled=true;try{const d=await api('/api/plans/'+data.plan_id+'/submit','POST',{session_id:session,revision:data.revision,option_ids:data.segments.map(s=>choices[s.leg_id]||'')});render(d);$('status').textContent='行程已生成并保存'}catch(e){$('status').textContent=e.message;submit.disabled=false}}}node('h2','住宿候选',root);for(const h of data.accommodation||[]){for(const o of h.options||[])node('p',h.city+' · '+o.name+' · 每晚 '+(o.nightly_price_yuan??'未知')+' 元 · '+(o.address||'地址待核实'),root)}node('h2','攻略来源',root);const seen=new Set();for(const source of data.sources||[]){if(seen.has(source.source_url))continue;seen.add(source.source_url);const a=node('a',source.title,root);a.href=source.source_url;a.target='_blank';a.rel='noopener noreferrer';node('p',source.text,root)}for(const hotel of data.accommodation||[])node('p',hotel.city+'住宿：'+hotel.message,root);$('evidence').textContent=JSON.stringify(data,null,2)}
$('plan').onclick=async()=>{const btn=$('plan');btn.disabled=true;$('status').textContent='正在开始规划…';try{const body={session_id:session,departure_city:$('from').value,departure_date:$('date').value,stops:$('stops').value.split(/[,，]/).map(x=>{const [city,days]=x.split(/[:：]/);return{city:city.trim(),days:Number(days)}}),adults:Number($('adults').value),children:Number($('children').value),budget_per_person:Number($('budget').value),hotel_per_night:Number($('hotel').value),meal_per_person_day:Number($('meal').value),styles:$('styles').value.split(/[,，]/),auto_confirm:$('auto').checked};const response=await fetch('/api/plans/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw Error(await response.text());const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const{value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){const event=buffer.slice(0,end);buffer=buffer.slice(end+2);const kind=event.split('\n').find(x=>x.startsWith('event: '))?.slice(7),line=event.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const data=JSON.parse(line.slice(6));if(kind==='status')$('status').textContent=data.message;if(kind==='result'){render(data);$('status').textContent=data.status==='completed'?'行程已生成并保存':'查询完成，等待选择'}if(kind==='error')throw Error(data.message)}}}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}};
$('send').onclick=async()=>{const btn=$('send');btn.disabled=true;try{const d=await api('/api/chat/dispatch','POST',{session_id:session,message:$('message').value});const value=d.data;$('chatReply').textContent=value.reply||JSON.stringify(value,null,2);const state=await api('/api/sessions/'+session);if(state.planning_result)render(state.planning_result)}catch(e){$('chatReply').textContent=e.message}finally{btn.disabled=false}};
$('new').onclick=()=>newSession().catch(e=>$('status').textContent=e.message);$('prefs').onclick=async()=>{try{await api('/api/users/'+user+'/preferences','PATCH',{pace:$('pace').value,travel_styles:$('styles').value.split(/[,，]/)});$('prefsStatus').textContent='偏好已保存，新会话也可使用'}catch(e){$('prefsStatus').textContent=e.message}};$('history').onclick=async()=>{try{const d=await api('/api/sessions/'+session+'/plans');if(d.plans.length)render(d.plans[0]);else $('status').textContent='此会话暂无计划'}catch(e){$('status').textContent=e.message}};init().catch(e=>$('status').textContent='初始化失败：'+e.message);
</script></html>
