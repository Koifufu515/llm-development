apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: wenshu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: wenshu
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: wenshu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: wenshu
---
apiVersion: v1
data:
  alerts.yml: "groups:\n- name: wenshu\n  rules:\n  - alert: WenshuHighErrorRate\n\
    \    annotations:\n      summary: 文枢服务5xx比例超过5%\n    expr: sum(rate(wenshu_http_requests_total{status=~\"\
    5..\"}[1m])) / clamp_min(sum(rate(wenshu_http_requests_total[1m])),\n      0.001)\
    \ > 0.05\n    for: 1m\n    labels:\n      severity: warning\n  - alert: WenshuHighLatency\n\
    \    annotations:\n      summary: 问答HTTP P95超过8秒\n    expr: histogram_quantile(0.95,\
    \ sum(rate(wenshu_http_duration_seconds_bucket[1m]))\n      by (le)) > 8\n   \
    \ for: 1m\n    labels:\n      severity: warning\n"
  prometheus.yml: "global:\n  evaluation_interval: 10s\n  scrape_interval: 5s\nrule_files:\n\
    - /etc/prometheus/alerts.yml\nscrape_configs:\n- job_name: wenshu-agents\n  kubernetes_sd_configs:\n\
    \  - namespaces:\n      names:\n      - wenshu\n    role: pod\n  metrics_path:\
    \ /metrics\n  relabel_configs:\n  - action: keep\n    regex: dept-agent|.*-backend\n\
    \    source_labels:\n    - __meta_kubernetes_pod_label_app\n  - replacement: $1:8000\n\
    \    source_labels:\n    - __meta_kubernetes_pod_ip\n    target_label: __address__\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n\
    \  - source_labels:\n    - __meta_kubernetes_namespace\n    target_label: namespace\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_label_department\n    target_label:\
    \ department\n"
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: wenshu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: wenshu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=24h
        image: prom/prometheus:v2.52.0
        name: prometheus
        ports:
        - containerPort: 9090
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 10m
            memory: 32Mi
        volumeMounts:
        - mountPath: /etc/prometheus
          name: config
      serviceAccountName: prometheus
      volumes:
      - configMap:
          name: prometheus-config
        name: config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: wenshu
spec:
  ports:
  - name: p9090
    port: 9090
    targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: v1
data:
  loki.yaml: "auth_enabled: false\ncommon:\n  instance_addr: 127.0.0.1\n  path_prefix:\
    \ /tmp/loki\n  replication_factor: 1\n  ring:\n    kvstore:\n      store: inmemory\n\
    \  storage:\n    filesystem:\n      chunks_directory: /tmp/loki/chunks\n     \
    \ rules_directory: /tmp/loki/rules\nlimits_config:\n  allow_structured_metadata:\
    \ false\nschema_config:\n  configs:\n  - from: '2024-01-01'\n    index:\n    \
    \  period: 24h\n      prefix: index_\n    object_store: filesystem\n    schema:\
    \ v13\n    store: tsdb\nserver:\n  http_listen_port: 3100\n"
