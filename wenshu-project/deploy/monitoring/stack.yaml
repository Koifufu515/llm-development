apiVersion: v1
data:
  config.yaml: "exporters:\n  debug:\n    verbosity: basic\n  otlphttp:\n    endpoint:\
    \ http://tempo:4318\nprocessors:\n  batch: {}\nreceivers:\n  otlp:\n    protocols:\n\
    \      grpc:\n        endpoint: 0.0.0.0:4317\n      http:\n        endpoint: 0.0.0.0:4318\n\
    service:\n  pipelines:\n    traces:\n      exporters:\n      - otlphttp\n    \
    \  - debug\n      processors:\n      - batch\n      receivers:\n      - otlp\n"
