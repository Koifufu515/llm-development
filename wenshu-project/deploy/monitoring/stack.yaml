apiVersion: v1
data:
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: Wenshu\n  options:\n    path:\
    \ /var/lib/grafana/dashboards\n  type: file\n"
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  uid: prometheus\n  url: http://prometheus:9090\n\
    - access: proxy\n  jsonData:\n    derivedFields:\n    - datasourceUid: tempo\n\
    \      matcherRegex: '\"trace_id\":\\s*\"([a-f0-9]{32})\"'\n      name: TraceID\n\
    \      url: ${__value.raw}\n  name: Loki\n  type: loki\n  uid: loki\n  url: http://loki:3100\n\
    - access: proxy\n  name: Tempo\n  type: tempo\n  uid: tempo\n  url: http://tempo:3200\n"
kind: ConfigMap
metadata:
  name: grafana-provision
  namespace: wenshu
---
apiVersion: v1
data:
  wenshu.json: '{"uid": "wenshu-overview", "title": "文枢运行与Agent观测", "schemaVersion":
    39, "version": 1, "panels": [{"id": 1, "type": "timeseries", "title": "HTTP吞吐",
    "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "datasource": {"uid": "prometheus",
    "type": "prometheus"}, "targets": [{"expr": "sum(rate(wenshu_http_requests_total[1m]))",
    "refId": "A"}]}, {"id": 2, "type": "timeseries", "title": "HTTP P95", "gridPos":
    {"x": 12, "y": 0, "w": 12, "h": 8}, "datasource": {"uid": "prometheus", "type":
    "prometheus"}, "targets": [{"expr": "histogram_quantile(0.95,sum(rate(wenshu_http_duration_seconds_bucket[1m]))
    by(le))", "refId": "A"}]}, {"id": 3, "type": "timeseries", "title": "部门在途请求",
    "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "datasource": {"uid": "prometheus",
    "type": "prometheus"}, "targets": [{"expr": "sum by(dept)(wenshu_dept_agent_inflight)",
    "refId": "A"}]}, {"id": 4, "type": "timeseries", "title": "pi执行/降级", "gridPos":
    {"x": 12, "y": 8, "w": 12, "h": 8}, "datasource": {"uid": "prometheus", "type":
    "prometheus"}, "targets": [{"expr": "sum by(agent,status)(rate(wenshu_pi_agent_execution_total[1m]))",
    "refId": "A"}]}, {"id": 5, "type": "timeseries", "title": "问答结果", "gridPos": {"x":
    0, "y": 16, "w": 12, "h": 8}, "datasource": {"uid": "prometheus", "type": "prometheus"},
    "targets": [{"expr": "sum by(intent)(wenshu_query_total)", "refId": "A"}]}, {"id":
    6, "type": "timeseries", "title": "采纳反馈", "gridPos": {"x": 12, "y": 16, "w": 12,
    "h": 8}, "datasource": {"uid": "prometheus", "type": "prometheus"}, "targets":
    [{"expr": "sum by(kind)(wenshu_answer_adoption_total)", "refId": "A"}]}]}'
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: wenshu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: wenshu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: grafana-password
              name: wenshu-ha-auth
        image: grafana/grafana:10.4.0
        name: grafana
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 10m
            memory: 32Mi
        volumeMounts:
        - mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          name: provision
          subPath: datasources.yaml
        - mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          name: provision
          subPath: dashboards.yaml
        - mountPath: /var/lib/grafana/dashboards
          name: dashboard
      volumes:
      - configMap:
          name: grafana-provision
        name: provision
      - configMap:
          name: grafana-dashboard
        name: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: wenshu
spec:
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
  selector:
    app: grafana
---
apiVersion: v1
data:
  promtail.yaml: "clients:\n- url: http://loki:3100/loki/api/v1/push\npositions:\n\
    \  filename: /tmp/positions.yaml\nscrape_configs:\n- job_name: local-pods\n  pipeline_stages:\n\
    \  - docker: {}\n  - regex:\n      expression: /var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*\n\
    \      source: filename\n  - labels:\n      container: null\n      pod: null\n\
    \  static_configs:\n  - labels:\n      __path__: /var/log/pods/wenshu_*/*/*.log\n\
    \      job: wenshu-pod-logs\n      namespace: wenshu\n    targets:\n    - localhost\n\
    server:\n  grpc_listen_port: 0\n  http_listen_port: 9080\n"
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: wenshu
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: wenshu
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      containers:
      - args:
        - -config.file=/etc/promtail/promtail.yaml
        image: grafana/promtail:3.0.0
        name: promtail
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 24Mi
        volumeMounts:
        - mountPath: /etc/promtail
          name: config
        - mountPath: /var/log/pods
          name: logs
          readOnly: true
        - mountPath: /var/lib/docker/containers
          name: docker-logs
          readOnly: true
      volumes:
      - configMap:
          name: promtail-config
        name: config
      - hostPath:
          path: /var/log/pods
        name: logs
      - hostPath:
          path: /var/lib/docker/containers
        name: docker-logs
