apiVersion: v1
data:
  tempo.yaml: "compactor:\n  compaction:\n    block_retention: 24h\ndistributor:\n\
    \  receivers:\n    otlp:\n      protocols:\n        grpc:\n          endpoint:\
    \ 0.0.0.0:4317\n        http:\n          endpoint: 0.0.0.0:4318\nserver:\n  http_listen_port:\
    \ 3200\nstorage:\n  trace:\n    backend: local\n    local:\n      path: /tmp/tempo/traces\n\
    \    wal:\n      path: /tmp/tempo/wal\n"
