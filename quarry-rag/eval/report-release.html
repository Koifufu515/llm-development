<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评测报告</title>
<style>
:root {
  --paper: #fffdfb; --surface: #fff; --surface-2: #fcf4f0; --tint: #ece3d7;
  --ink: #1b1915; --muted: #8b8179;
  --rule: #e8e0d9; --up: #2e7d64; --down: #c0482f; --warn: #a3762a;
  --accent: #d97757; --accent-soft: #f6dcd0; --accent-line: #e8c3b2;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
/* 深色只在显式 <html data-theme="dark"> 时生效，系统深色模式不再自动切换 */
:root[data-theme="dark"] {
  --paper: #191715; --surface: #211e1c; --surface-2: #282422; --tint: #3b3531;
  --ink: #f0ece8; --muted: #9c938c;
  --rule: #38332f; --up: #5fbd9c; --down: #e5815f; --warn: #d4a44f;
  --accent: #e08a68; --accent-soft: #3a2a22; --accent-line: #57392c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.6;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 36px 20px 64px; }
h1 { font-size: 23px; margin: 0; font-weight: 700; text-align: center; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 6px; text-align: center; }
.headline { margin: 26px auto 0; font-size: clamp(18px, 2.3vw, 24px); font-weight: 500; line-height: 1.5;
  max-width: 46ch; text-align: center; }
.up { color: var(--up); } .down { color: var(--down); }
.metrics { margin-top: 26px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
.metric { padding: 13px 15px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.metric .name { font-size: 12px; color: var(--muted); }
.metric .line { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; }
.metric .val { font-size: 21px; font-weight: 700; font-family: var(--mono); letter-spacing: -.02em; }
.metric .delta { font-size: 12.5px; font-weight: 500; font-family: var(--mono); }
.bar { height: 4px; background: var(--surface-2); margin-top: 10px; position: relative; border-radius: 999px; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; background: var(--accent); }
.bar i.was { background: var(--tint); }
.gate { display: flex; flex-wrap: wrap; gap: 10px; padding: 11px 15px; font-size: 13.5px; margin-top: 10px;
  border: 1px solid var(--rule); border-radius: 10px; background: var(--surface-2); }
.gate:empty, .metrics:empty { display: none; }
.gate.pass { color: var(--up); } .gate.fail { color: var(--down); }
.gate span { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 14px; }
.chip { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip:hover { border-color: var(--accent-line); background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.chip .n { color: var(--muted); margin-left: 6px; font-family: var(--mono); font-size: 12px; }
.chip[aria-pressed="true"] .n { color: rgba(255, 255, 255, .72); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }
.list { background: none; }
.list-head, .row { display: grid; grid-template-columns: minmax(0, 1fr) 176px 92px 62px; align-items: center;
  gap: 12px; padding: 0 16px; text-align: left; }
.list-head { font-size: 12px; color: var(--muted); padding-bottom: 9px; }
.row { width: 100%; font: inherit; color: inherit; cursor: pointer; padding: 11px 15px; margin-bottom: 8px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.row:hover { background: var(--surface-2); border-color: var(--accent-line); }
.row[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.q { min-width: 0; }
.q .text, .q .path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q .text { font-size: 14.5px; }
.q .path { font-size: 12px; color: var(--muted); margin-top: 2px; }
.track { width: 176px; height: 20px; }
.verdict { font-size: 11.5px; font-family: var(--mono); padding: 2px 9px; border-radius: 999px; display: inline-block; white-space: nowrap; }
.v-supported { background: color-mix(in srgb, var(--up) 13%, transparent); color: var(--up); }
.v-partial { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.v-unsupported { background: color-mix(in srgb, var(--down) 13%, transparent); color: var(--down); }
.v-none { color: var(--muted); }
.ms { font-size: 12.5px; color: var(--muted); text-align: right; font-family: var(--mono); }
.detail { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
@media (min-width: 1000px) { .detail { position: sticky; top: 20px; max-height: calc(100vh - 44px); overflow-y: auto; } }
.detail-in { padding: 17px 18px 18px; }
.detail h2 { font-size: 15.5px; margin: 0 0 5px; line-height: 1.45; font-weight: 600; }
.detail-in > .gold { font-size: 12px; color: var(--muted); margin-bottom: 15px; }
.run-block { border-top: 1px solid var(--rule); padding-top: 13px; margin-top: 13px; }
.run-block:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.run-name { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.ev { border-left: 2px solid var(--rule); padding: 7px 0 7px 11px; margin-top: 10px; font-size: 13px; }
.ev.gold { border-left-color: var(--accent); }
.ev .meta { font-size: 10.5px; color: var(--muted); font-family: var(--mono); display: flex; gap: 9px; flex-wrap: wrap; }
.ev .snippet { margin-top: 4px; line-height: 1.65; white-space: pre-wrap; }
.ph { background: var(--accent-soft); border-radius: 3px; padding: 0 4px; font-size: 12.5px; white-space: nowrap; }
.facts { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
.fact { font-size: 12px; display: flex; gap: 7px; align-items: baseline; }
.fact b { font-family: var(--mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.d-verified { background: var(--up); } .d-expired { background: var(--warn); } .d-unverified { background: var(--tint); }
.fact .old { color: var(--muted); }
.judge-box { font-size: 12.5px; color: var(--muted); margin-top: 11px; }
.empty { padding: 26px 4px; color: var(--muted); font-size: 13.5px; line-height: 1.75; }
footer { margin-top: 32px; font-size: 12px; color: var(--muted); line-height: 1.8; }
@media (max-width: 720px) {
  .list-head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) 96px; }
  .track { width: 96px; }
  .ms, .verdict-cell { display: none; }
}
</style>
</head>

  </div>
  <footer id="foot"></footer>
</div>

设计的整个哈尔滨文化岛（Harbin Cultural Island）项目中的第一个亮相的建筑，也是其中规模最大的一个。建筑由一大一小两个音乐厅以及一个偌大的公共空间组成，三个主要空间通过一个“丝带”似的建筑屋顶连接在一起，露出来的部分钢结构玻璃幕墙屋顶仿佛丝带包裹住的一颗宝石闪烁在松花江畔。2015年在著名建筑新闻网站ArchDaily举办的“世界年度作家建", "facts": [], "level": "neighbors"}, {"gold": false, "path": "学习", "text": "香港最早記載的學校是錦田的力瀛書院，1075年由北宋進士鄧符協所建這類書院、書室屬於私學的一部分，教授《四書》、《五經》，然後在英國統治時期逐漸轉變為鄉村學校或者公立學校。\n英國接管香港後，在香港發展與英國相似的教育制度，設立多間公辦的官立小學及中學，以英語為授課語言，並在1910年成立香港首間大學—香港大學，培訓學術人才；發展至今，共有8所受大學教育資助委員會資助（公立）的大學，及1所私立大學（香港樹仁大學）。\n而現時香港教育主要由香港政府的教育局統籌及管理，學校可分為四種：官立學校、津貼學校、直資學校及私立學校。主流教育可分為四大部份：學前教育、6年的小學教育、6年的中學教育（包括3年初中、3年高中）及專上教育（包括學士、副學士、專業文憑、高級文憑等）。\n自1997年7月1日香港主權移交後，政府推行一連串的", "facts": [], "level": "section"}]}, "new": {"rank": 1, "ms": 1201, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出天津大学始建于1895年。", "evidence": [{"gold": true, "path": "学校", "text": "津门故里：即天津古文化街，位于南开区，以天后宫为中心，是体验天津民俗文化和城市起源的重要窗口1。\n盘山风景名胜区：位于蓟州区，以“五峰”“八石”“三盘之胜”闻名，是自然山水与名胜古迹相结合的著名风景区\n“天津之眼”摩天轮：位于河北区，是一座跨河建设、桥轮合一的摩天轮。\n天津五大道文化旅游区：位于和平区，拥有上世纪二三十年代建成的具有不同国家建筑风格的花园式房屋，是近代建筑博览苑。\n天津泰达航母主题公园：位于滨海新区，以“基辅号”航母为核心，是集军事观光、主题体验于一体的大型军事主题公园。\n天津黄崖关长城：位于蓟州区，是明代蓟镇长城的重要关隘，地势险要。\n天津极地海洋公园：位于滨海新区，是集海洋动物展示、表演、科普教育于一体的极地海洋主题公园。\n天津热带植物观光园：位于西青区，园内种植了众多热带植物。\n大沽口炮台", "facts": [], "level": "neighbors"}, {"gold": false, "path": "抵达 > 航空", "text": "天津市区居民讲天津话，属于汉语普通话的一个语支。尽管距离北京很近，但天津话与北京话的发音却大相径庭。北京话是中华人民共和国官方语言普通话的基础。\n天津是京剧的圣地，京剧是中国戏曲中最负盛名的艺术形式之一。\n\n天津以相声表演闻名，涌现出郭德刚、马三立等相声演员。马三立（1914-2003）是回族人，长期居住在天津，以相声表演而闻名。相声是一种广受欢迎的中国娱乐形式，类似于喜剧。马三立曾用天津方言表演过一些相声。天津与北京并称为相声艺术的中心。\n\n杨柳青（又名绿柳镇），位于天津市区以西约15公里处，是天津市西青区的行政中心，以其广受欢迎的春节主题传统画作“杨柳青年画”而闻名。天津也以“泥人张”而闻名，泥人张是一种色彩鲜艳、人物形象生动的陶俑。此外，天津的“风筝魏”因其可折叠成小巧的尺寸而备受青睐，便于携带。\n\n天津", "facts": [], "level": "neighbors"}, {"gold": false, "path": "交通", "text": "天津有客船连接大连和韩国仁川。\n\n天津公交系统始建于1904年，是中国最早的公交系统；地铁则于1970年开通，位列全国第二。如今，天津的公共交通十分发达。市内公交线路，12公里以内（7公里以内）的票价为1.5元；12公里以上的线路，即使实际行程不足12公里（7英里），票价也为1元。建议您提前查询热门公交线路。公交车舒适干净。\n津滨轻轨连接天津火车站和东海路泰达海滨区域。\n\n出租车数量众多。起步价为8元（3公里），之后每公里1.7元。出租车也会按车辆静止时间收费，每五分钟收费1.7元人民币（五分钟以内免收费用）。请避免在火车站附近乘坐出租车。请参 路：\n\n第一天，早上由张家界永定市区的中心汽车站乘车前往森林公园门票站。在旅游旺季，由于多数游客选择这个入口，一般早上八九点入口处就已是人山人海了。买票进入，步行一段平路约6分钟，来到大氧吧广场，这里是许多旅行团和游客集中的地方，也是入园后的第一个风景点。这时可以选择在广场西侧（左面）的车站乘坐环保车约4分钟到黄石寨游览，也可以直接前往金鞭溪或鹞子寨。上黄石寨一般是坐索道（在下车的地方旁边坐，索道站可以拿黄石寨地图）到寨顶（寨顶较为平坦），七分钟后到达寨顶。寨顶的游览线路是环形的，出站向左向右皆可。绕整个寨顶一周大约100分钟，基本为平路，偶有起伏。黄石寨东面的山谷对面是袁家界，下方山谷是金鞭溪，北面远处是杨家界南缘。黄石寨游客不少，以", "facts": [], "level": "section"}, {"gold": false, "path": "抵达 > 航空", "text": "1 哈尔滨太平国际机场。   (更新日期：2025年3月)\n\n哈尔滨太平国际机场 ，地处东北亚中心位置，是东北地区第三大国际航空港，亦是中国东北地区乃至东北亚的重要空中交通枢纽之一，是目前东北地区继大连、沈阳机场后国家正式批复的三座“门户机场”之一，飞行区技术等级为4E，规划兼顾F级飞机起降。\n有班机飞往国内三十多个大、中旅游城市，还有定期航班飞往其他国家和地区；另外通过中国国际航公司、中国东方航空、中国南方航空的国际联程航线可便捷中转至美国、新加坡、马来西亚、德国、英国、法国、西班牙、巴西、加拿大、阿联酋、希腊等国家和地区。\n哈尔滨太平国际机场距离市区较远，乘机前应提前出发。另外，机场没有地铁和铁路，最好乘坐机场巴士，在机场内即可买票上车，20元一位，通达市区及其他邻近城市。如果要乘坐出租车，注意不要被宰客，", "facts": [], "level": "section"}]}, "new": {"rank": 1, "ms": 405, "abstained": false, "judge": "supported", "judge_reason": "证据明确列出机场大巴和出租车两种方式", "evidence": [{"gold": true, "path": "抵达 > 飞机", "text": "拉萨市下辖3个市辖区、5个县。\n\n市辖区：城关区、堆龙德庆区、达孜区\n县：林周县、当雄县、尼木县、曲水县、墨竹工卡县\n\n拉萨贡嘎机场，地址 山南地区贡嘎县甲竹林镇（距拉萨市区约65km，可走高速），📞 (0)891-6216465。簡介 拉萨至北京、上海、广州、深圳、重庆、成都每天都有航班，飞往其他城市则不是每天都有。其中成都和拉萨之间往返航班次数最多，可以在成都转机。需要注意的是，部分人下飞机时会有高原反应，需做好准备。\n机场大巴 ，终点站为拉萨娘热路1号民航局，￥5/人，车程1小时左右。运营时间6:30-19:30，约1小时1班。\n乘出租车前往市区约需45分钟，￥150左右。\n\n较飞机而言，乘火车到拉萨可以很好地观赏沿途青藏高原风光。虽然时间较长，但拔缓慢升高，更有助于适应高原环境。当前只有北京、兰州、西宁", "facts": [], "level": "neighbors"}, {"gold": false, "path": "抵达 > 自驾", "text": "2 北郊客运站，地址 拉萨市扎基路11号（近色拉中路），📞 +86 0891-6922090，+86 0891-6922104 。簡介 长途客运为主。\n3 东郊客运站，地址 拉萨市江苏东路3号，📞 +86 (0)891-6340523。\n4 西郊客运站（金珠路客运站-拉萨长途客运站），地址 拉萨市金珠中路1号，📞 +86 (0)891-6824469。\n\n可以经由 109国道、 318国道、 349国道、 561国道和 京藏高速公路等线路到达拉萨。\n\n這裡的公共交通是西藏最好的交通工具，大多數目的地都有每日公交車。", "facts": [], "level": "neighbors"}, {"gold": false, "path": "抵达 > 客车", "text": "较飞机而言，乘火车到拉萨可以很好地观赏沿途青藏高原风光。虽然时间较长，但拔缓慢升高，更有助于适应高原环境。当前只有北京、兰州、西宁、成都、重庆、上海、广州这几个城市有直达拉萨的火车。\n\n1 拉萨站，地址 拉萨市堆龙德庆区柳梧乡。\n火车站海拔约3600m。从火车站乘出租至市内大概要￥20。\n\n2 北郊客运站，地址 拉萨市扎基路11号（近色拉中路），📞 +86 0891-6922090，+86 0891-6922104 。簡介 长途客运为主 ath": "夜生活 > 俱乐部", "text": "虽然哈尔滨在大约半年之内都特别的冷，但这并不意味着没有夜生活，对“哈尔滨没有夜生活”的误读可以有如下解释：哈尔滨的时区实际上属于东九区（民国时称“长白时区”），但用的是东八区时间。所以天黑得早，而早晨上班时间不变，相当于全年都在拨慢一个时区，因此与其他地区夜生活不同步。并且哈尔滨纬度高气候寒冷，一年中有半年是冬天，公共服务运营考虑气候条件和运营成本不会太晚还在运作。考虑到以上原因，哈尔滨的夜生活时间其实是正常的。\n哈尔滨有很多外国人住在城市学习和工作，周末总是有繁华的2-3个地点，如蓝调，箱子，步行者或大学附近的小酒吧。除此之外，年轻人还可以去KTV、民谣青旅等。夏夜的哈尔滨非常热闹，中央大街、松花江边、果戈里大街等都是好去处，老城区总能看到夜晚的路边烧烤。\n在哈尔滨，在寒冷的冬季之前，一年中的大半年时间，中央", "facts": [], "level": "neighbors"}]}, "new": {"rank": 1, "ms": 704, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出后海接驳北京地铁8号线什刹海站。", "evidence": [{"gold": true, "path": "夜生活", "text": "北京有很多老字号餐厅，坐落在市区的不同角落。位于前门的全聚德、大栅栏的便宜坊是北京烤鸭的名誉餐厅，还有很多小餐厅提供炸酱面等京味佳肴。一些小吃店也售卖驴打滚、豌豆黄、小豆凉糕等风味小吃。位于前门大街边上的大栅栏-鲜鱼口步行街是西城区多数美食老字号的聚集地。而在西四、东单、王府井、西单、簋街等繁华地带也有众多不同风味的餐厅\n\n北京烤鸭：全聚德烤鸭是北京特色饮食之一，其总部位于北京东城区前门大街30号。其鴨肉特別鮮嫩，肉雖肥而不膩，味美香甜，常吃不厭。如果需要，您可以选择打包，带给家人或朋友享用。\n炸酱面：北京市区有多家“老北京炸酱面”餐厅。\n火锅\n炒肝：老字号“天兴居”有售卖炒肝，该店铺位于大栅栏-鲜鱼口步行街东口处，便宜坊（前门店）西侧。\n爆肚\n卤煮火烧\n门钉肉饼\n炒疙瘩\n螺丝转\n焦圈\n灌肠\n姜汁排叉\n豆汁\n茶", "facts": [], "level": "neighbors"}, {"gold": false, "path": "夜生活 > 酒吧", "text": "在广州，有麦当劳（McDonald's）、肯德基（KFC）、汉堡王（Burger King）、赛百味（Subway）、必胜客（Pizza Hut）、棒约翰（ Papa John's Pizza ）、哈根达斯（Häagen-Dazs）、星巴克（Starbucks）、萨莉亚（Saizeriya）、味千拉面等国际连锁餐饮机构。在各大购物中心都能见到他们的店铺。\n\n在中国的大城市中，广州是它们中拥有各种特色酒吧最多的城市之一。在这里，你能找到最适合你的酒吧。\n目前，广州的酒吧主要集中在：\n\n1 沿江路酒吧街，地址 越秀区沿江西路（地铁2号线海珠广场）。簡介 这里的酒吧都拥有珠江的景色，是受广州年轻人欢迎的地方之一。\n2 芳村白鹅潭风情酒吧街，地址 荔湾区白鹅潭（地铁1号线、巴士芳村站。）。💰 价格较实惠。簡介 同样位于", "facts": [], "level": "neighbors"}, {"gold": false, "path": "夜生活 > 酒吧 > Live House", "text": "在中国的大城市中，广州是它们中拥有各种特色酒吧最多的城市之一。在这里，你能找到最适合你的酒吧。\n目前，广州的酒吧主要集中在：\n\n1 沿江路酒吧街，地址 越秀区沿江西路（地铁2号线海珠广场）。簡介 这里的酒吧都拥有珠江的景色，是受广州年轻人欢迎的地方之一。\n2 芳村白鹅潭风情酒吧街，地址 荔湾区白鹅潭（地铁1号线、巴士芳村站。）。💰 价格较实惠。簡介 同样位于江边，这里的顾客多是广州本地人。\n3 环市路华侨新村酒吧街，地址 越秀区环市路（地铁5号线淘金站）。💰 价钱较高，大约维持在啤酒300元/打左右的消费水平。簡介 位于环市路，消费人群主要是外籍人士，高级白领。\n4 琶醍酒吧街，地址 海珠区阅江西路（广州有轨电车琶醍站）。💰 价钱较高。簡介 位于珠江啤酒厂旁，与珠江新城隔江相望。\n5 太古倉碼頭，地址 鳳凰崗革", "facts": [], "level": "neighbors"}]}}, {"qid": "e953411c1903ad44", "query": "圓山大飯店在哪個區？", "kind": "answerable", "note": "助手按原文复核；非独立人工标注；住宿", "dir": "same", "base": {"rank": 1, "ms": 252, "abstained": false, "judge": null, "judge_reason": null, "evidence": [{"gold": true, "path": "住宿", "text": "1 士林夜市。簡介 位於士林文林路、大東路和安平路之間，於巷子內，著名的蚵仔煎、生炒花枝、鐵板燒、青蛙下蛋、蜜豆冰、薑汁番茄、廣東粥、紅油抄手、大餅包小餅、綜合水果冰品等，匯集了都是膾炙人口的小吃美食，其他的如流行服飾店、CD專賣店、運動用品店和手飾品商店等，在這裡都能買得到。\n2 饒河夜市（饒河街夜市、饒河街觀光夜市），地址 松山區。簡介 街名源自合江省饒河縣（今屬黑龍江省），滿語意為「禽獸眾多之地」。位於臺灣臺北市松山區饒河街，為臺北市著名的觀光夜市之一，也是臺灣繼華西街觀光夜市後第二座觀光夜市。饒河街與松山車站一帶舊稱錫口，因基隆河水深、此區又臨河濱，得舟楫之便，逐而成為基隆、宜蘭貨物運至臺北之轉運站，當時商賈雲集、舟船輻輳，極一時之盛。日治時期改名松山，後又因港岸河水淤樍，停泊船隻漸少，再加上八德路拓寬", "facts": [], "level": "neighbors"}, {"gold": false, "path": "通訊", "text": "臺北提供了從基本宿舍至5星級豪華飯店的各式各樣的住處。請參見各區條目來了解詳細資訊。\n中正區當地有臺北車站，以及許多便宜的住宿，想要在臺北睡一晚的遊客或許會想留在中正區。而西門町周圍的飯店，為喜歡品嚐當地小吃、購物與聚會的遊客首選。商務型遊客可能更喜歡住在信義區，許多的豪華飯店都設在金融中心附近。圓山大飯店位於中山區，此飯店曾是蔣介石迎外國政要的合適住處，針對喜歡古典中式建築和歷史感興趣的遊客，可能會是必去的飯店。10％的服務費和5％的增值稅通常不包括在高檔的飯店房價內。\n如果您想要在臺北住一段日子，或著是一位通勤族遊客，甚至是生活在市區以外的郊區（例如：新店和永和等地），可以選擇有臺北捷運暫的附近便宜住宿，將可以省下不少的住宿費用。\n\n在臺北市區，手機的使用非常普遍，鬧區也有機會找到公共電話；通常政府或公共機", "facts": [], "level": "neighbors"}, {"gold": false, "path": "購物 > 商圈", "text": "以下為臺北知名的百貨公司，遊客可以在這裡找到許多精品與服飾：\n\nH&M 微風松高店，地址 信義區松高路16號，📞 +886 2 7729 1310。🕘 週日至週三 11:00 - 21:30，週四至週六 11:00 - 22:00。\n\n以下為臺北知名的購物街或商圈，遊客可以在這裡找到許多物美價廉的東西：\n\n1 迪化街，地址 大同區中華路迪化街一段。簡介 迪化街就像是臺北的歷史長廊，是大稻埕商圈最重要的市街。買賣布匹的永樂市場展售各式布帛，街區店舖仍販售茶葉、中藥及南北貨。每到農曆春節前，這裡更是湧入辦年貨的人潮，散發過年團圓喜悦氣氛。小巷弄裡的間式建築和紅磚洋樓，因為文創風潮而再生，逛累了，不妨停歇老屋宅邸品茗、賞藝術。 (更新日期：2019年7月)\n\n1 國立臺灣大學（台大、NTU），地址 臺北市大安區羅斯福", "facts": [], "level": "neighbors"}]}, "new": {"rank": 1, "ms": 467, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出圆山大饭店位于中山区。", "evidence": [{"gold": true, "path": "住宿", "text": "1 士林夜市。簡介 位於士林文林路、大東路和安平路之間，於巷子內，著名的蚵仔煎、生炒花枝、鐵板燒、青蛙下蛋、蜜豆冰、薑汁番茄、廣東粥、紅油抄手、大餅包小餅、綜合水果冰品等，匯集了都是膾炙人口的小吃美食，其他的如流行服飾店、CD專賣店、運動用品店和手飾品商店等，在這裡都能買得到。\n2 饒河夜市（饒河街夜市、饒河街觀光夜市），地址 松山區。簡介 街名源自合江省饒河縣（今屬黑龍江省），滿語意為「禽獸眾多之地」。位於臺灣臺北市松山區饒河街，為臺北市著名的觀光夜市之一，也是臺灣繼華西街觀光夜市後第二座觀光夜市。饒河街與松山車站一帶舊稱錫口，因基隆河水深、此區又臨河濱，得舟楫之便，逐而成為基隆、宜蘭貨物運至臺北之轉運站，當時商賈雲集、舟船輻輳，極一時之盛。日治時期改名松山，後又因港岸河水淤樍，停泊船隻漸少，再加上八德路拓寬", "facts": [], "level": "neighbors"}, {"gold": false, "path": "活動", "text": "臺北大縱走步徑。簡介 為臺北分為五大山系(大屯山、七星山、五指山、南港山、二格山)，擁有火山地質、溫泉、山陵線等多種不同景觀，極具發展為國際步道之潛力；環繞臺北盆地天際線的臺北大縱走步徑，全長92公里、海拔高差1120公尺，臺北大縱走步徑可分為七段旅途，沿途行經陽明山國家公園竹子湖、白石湖、圓山、四獸山、貓空等著名景點，可以洗溫泉、賞花、賞蝶、賞芒、品茗、嚐草莓，更適合生態漫遊，全程皆可環瞰市景及臺北101，並可攀登臺北最高峰七星山(海拔1120公尺)及觀賞小油坑火山噴氣的景觀，成為第一條首都的長距離步道，藉此可以走在臺北天際線上，體驗另一種角度欣賞臺北美景。 (更新日期：2020年6月)\n\n1 徒步健行。簡介 可以前往壯麗景致的陽明山國家公園走走去， 是一座夢幻般的目的地，且有眾多的遠足機會。\n2017臺北燈", "facts": [], "level": "neighbors"}, {"gold": false, "path": "購物", "text": "1 徒步健行。簡介 可以前往壯麗景致的陽明山國家公園走走去， 是一座夢幻般的目的地，且有眾多的遠足機會。\n2017臺北燈節，地址 臺北市萬華區（捷運西門站6號出口處）。簡介 2017年2月4日至12日。位於捷運西門站周邊，另規劃有北門/中山堂光雕區、世大運互動區、地景創作區及燈海等各種主題燈區，中山堂除了有光雕區外，廣場還有學生創作區，以及西本願寺廣場的自由創作區等。 (更新日期：2017年2月)\n2 五月十三迎城隍，地址 臺北市大同區迪化街一段61號。簡介 霞海城隍廟為臺北市大稻埕一帶重要的民間信仰中心，也是以月老奉姻緣聞名海內外的寺廟，歷經多次整修，建築規模雖小，仍傳承了傳統閩南式廟宇建築講究曲線、重視裝飾等特色。廟宇裝飾藝術包括泥塑、壁畫、彩繪、剪黏、交趾陶，除日治時期作品外，修復工程也多出名師之手，並保", "facts": [], "level": "neighbors"}]}}, {"qid": "64d433b36144b2f7", "query": "增城出租车每公里多少钱？", "kind": "answerable", "note": "助手按原文复核；非独立人工标注；交通 > 出租车", "dir": "same", "base": {"rank": 1, "ms": 215, "abstained": false, "judge": null, "judge_reason": null, "evidence": [{"gold": true, "path": "交通 > 出租车", "text": "在2010年开通，主要在天河区和黄埔区运行。BRT的巴士在号码前有B字（例如B1、B15)。除B1路在任何一个BRT车站都有站点外，其他BRT路线在部分BRT设站，部分在普通站点设站。在BRT车站，乘客在进入站台时用羊城通或现金付费（2元），在上车时无需再次付费。在进站后要留意巴士停靠的站台号码与方向，乘客可以在任何一个门上下车，在BRT车站可以免费换乘其他BRT巴士（在普通巴士站不能免费换乘）。BRT系统有效地缓解了天河路，中山大道的交通堵塞。在高峰期，BRT巴士因其拥有自己的专用道，是最快的交通工具，但是会十分拥挤，请乘客预留出时间。\n\n市区内起步价为12元，超过3公里部分的续租价为每公里2.6元。如果营运时速低于10公里，按照每小时44元收取候时费。空车返回费实行阶梯式附加收费，15至25公里的部分按照续", "facts": [], "level": "neighbors"}, {"gold": false, "path": "周游 > 出租车", "text": "1号线：镇海路 - 中山公园 - 将军祠 - 文灶 - 湖滨东路 - 莲坂 - 莲花路口 - 吕厝（转2号线） - 乌石浦 - 塘边 - 火炬园 - 殿前 - 高崎 - 集美学村 - 园博苑 - 杏林村 - 杏锦路 - 官任 - 诚毅广场 - 集美软件园 - 集美大道 - 天水路 - 厦门北站 - 岩内\n2号线：五缘湾 - 钟宅 - 湿地公园 - 五通 - 两岸金融中心 - 东宅 - 观音山 - 何厝 - 软件园二期 - 岭兜 - 古地石 - 蔡塘 - 后埔 - 江头 - 吕厝（转1号线） - 育秀东路 - 体育中心 - 湖滨中路 - 建业路 - 邮轮中心 - 海沧湾公园 - 海沧商务中心 - 海沧行政中心 - 马青路 - 翁角路 - 新垵 - 新阳大道 - 东孚 - 天竺山\n3号线(2021年6月25日 拔在数百米到2000多米之间，山地的许多地方都有非常显著的丹霞地貌。而北京的城区等平原地区，海拔大多在20-60米之间。北京的山通常被茂密的森林覆盖，大多数地方是落叶阔叶与针叶混交林，海拔很高的地方是针叶林。一般来讲，游客不论到什么地方，都不会有高山反应，因为一般高山反应只会在到海拔3000米以上的地方时才出现。\n", "facts": [], "level": "neighbors"}, {"gold": false, "path": "了解 > 氣候", "text": "在中国东北部，黑龙江省南部，松嫩平原东南缘，松花江中游南岸，哈尔滨不仅是T字形铁路（中东铁路）的节点，更是地理术语上的“过河点”，即陆路交通线穿过河流需要造桥或建码头的地点，也是人流物流的集聚处，城市建设的有利区位。历史上因“过河点”而兴起的城市最典型的两个代表就是因为泰晤士河而发达的伦敦和因为中东铁路而繁荣的哈尔滨。又因其处在版图形似天鹅的黑龙江省的修长颈处，被誉为“天鹅项下珍珠城”。\n为迎合松花江的流势，整个哈尔滨的城市走向斜了45°，所谓的东大直街、西大直街，其实都是歪的。全城基本没有正南正北的干道，要是问路，少有人会用方位来回答。可以这样来理解：大直街是哈尔滨最大的主街，地铁1号线贯通而过，以省博物馆所在的红博广场为界，两侧分别叫作东大直街和西大直街，大直街以北，是旅行者最常前往的区域，以滨洲铁路为界，", "facts": [], "level": "neighbors"}]}, "new": {"rank": 1, "ms": 493, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出昆明冬季会下雪。", "evidence": [{"gold": true, "path": "", "text": "昆明（Kūnmíng）是中国云南省的首府。因夏无酷暑、冬无严寒、气候宜人，素以“春城”著称。昆明地处接近热带的纬度，海拔2000米，这给予了其温和宜人的气候。不过在冬季时这里还是会下雪，所以在冬季前往的话，记得带上保暖的衣物。还有，下雨是时候也有有些冷。\n尽管交通繁忙的街道会有过量的废弃污染，这里的空气相较中国其他的城市也更为洁净。昆明市的人口已经超过1000万而且城市仍在飞速扩大。得益于良好的气候环境，花卉养殖在这里的一个重要产业。花展和花市还有一个大型植物园值得去参观。\n除了其自身的美丽，昆明作为去云南旅游的第一站，也是去往热带天堂西双版纳的中转地。拥有世界自然遗产——云南石林。\n\n云南是中国西南重要的交通枢纽。它与中国的地方地方在公路、铁路、航空上有着良好的连接，而且有辐射东南亚范围的航空路线。", "facts": [], "level": "neighbors"}, {"gold": false, "path": "瞭解 > 气候", "text": "史书上对昆明地区最早的记载是公元前279年，楚国大将庄蹻远征到达滇池地区，由于秦国打败了楚国，无法回国，而被迫留在滇池以南地区，“变服从其俗”，建立了滇国。225年，诸葛亮南征也到达滇池地区，改为建宁郡，为爨氏所据。而司马迁在《史记》中亦提到过昆明地区。\n765年，南诏王阁罗凤决定向东拓展疆土，派其子凤伽异在今昆明市中心筑造拓东城，后改称鄯阐城。是为昆明筑城之始。\n1937年抗日战争爆发以后，昆明成为“抗日大后方”，许多学校、工厂（如中央机器厂、中央电工厂、军工光学厂、钢铁厂）、银行、商号和难民辗转搬迁昆明。1937年昆明人口为14万多人，到1945年人口增至25万多人。1938年修筑的滇缅公路（长959千米），以及中印“驼峰航线”，使得昆明成为抗战期间中国接受国际援助的主要通道和物资转往全国各地的中转站，城市", "facts": [], "level": "neighbors"}, {"gold": false, "path": "了解 > 氣候", "text": "在黃山國家公園總共發現了1450多種植物。最為奇特的是黃山松，這種松樹是從堅硬的花崗岩石里長出來的，並且緊貼著花崗岩石。人們根據它們的不同的形態和神韻，分別給它們起了貼切的自然而又典雅有趣的名字，如迎客松、黑虎松、臥龍松、龍爪松、探海松、團結松等。有記錄的動物大約有470種。地面上經常看到的是松鼠和小蜥蜴。\n\n夜間寒冷，（海拔1800米）。冬天道路結冰，非常危險。\n\n黄山机场，位于黄山市屯溪区，有往返北京、上海、重庆、广州、合肥、天津、海口、深圳、福州、杭州、武汉、西安、桂林、昆明、厦门、珠海、长沙、济南、香港、澳门等城市的航班。\n由黄山机场前往黄山风景区，可先乘坐公车或出租车到屯溪汽车站，然后坐开往黄山景区的 上的旅客可以帶以下物品進入香港香港以作他/她自用或作為他/她的免稅津貼部分：\n\n免稅攜帶1升在攝氏20度的溫度下量度所得酒精濃度以量計多於30%的飲用酒類進入香港\n免稅攜帶19支香煙/雪茄1支/25克雪茄/25克其他製成煙草\n持香港身份證的旅客，則必須離港不少於24小時才可以享有以上豁免數量。\n任何作貿易、營商或商業用途的應課稅品均無免稅優惠。攜有該等物品的旅客必須：\n\n使用紅通道；\n向海關人員申報攜有該等物品的目的；以及\n向海關關長呈交報關單。\n旅", "facts": [], "level": "neighbors"}, {"gold": false, "path": "到达 > 客轮 > 海天客運碼頭", "text": "「噴射飛航」〔由新渡輪(澳門)營運〕船班往返香港和澳門，船程約需60至75分鐘。\n「珠江客運」提供船班往返香港和廣東省主要城市。\n地址：九龍尖沙咀廣東道33號（港鐵尖沙咀站A1出口）。\n\n金珠船務管理服務有限公司，提供船班往返澳門氹仔及外港客運碼頭。\n\n海天客運碼頭為旅客提供快船轉駁服務，旅客可經香港國際機場往返珠三角地區，而毋須辦理出入境及海關手續及行李認領。旅客抵港後，可到位於1號客運大樓轉機區E2的「往內地／澳門快船票務處」購買船票，再乘搭旅客捷運系統前往海天客運碼頭登上快船。\n\n「珠江客運」提供船班往返香港和珠江三角口岸城市，包括：深圳蛇口，中山和東莞的虎門和珠海。\n「機場噴射飛航」提供船班往返香港和澳門及廣州（南沙）*。\n地址：大嶼山赤鱲角香港國際機場\n\n金珠船務管理服務有限公司，提供船班往返澳門氹仔", "facts": [], "level": "neighbors"}]}, "new": {"rank": 1, "ms": 437, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出机场快线从机场到香港站全程约需24分钟。", "evidence": [{"gold": true, "path": "到达 > 航空 > 在香港境內往返機場", "text": "主條目：香港國際機場\n在1998年7月投入運作的香港國際機場（IATA代碼：HKG）是東亞地區重要的航空運輸樞紐之一，位於距離市區34公里的赤鱲角。香港國際機場是國泰航空和它的子公司香港快運航空（航點位於亞洲之內）的樞紐機場，其他以此為紮根之地的航空公司尚有香港航空。現時有超過100家航空公司提供航班，使遊客可以從此前往全球170個城市（包括中國北京、上海等50座城市）。\n\n香港國際機場位於赤鱲角，擁有完善的交通配套設施。由機場搭乘列車、公共汽車、計程車和酒店接駁巴士往返市區，車程在約30分鐘之內，而且車資相宜。旅客也可搭乘快速船前往中國內地。機場快綫是來往機場和市區最快速的交通工具。乘客從機場出發，前往香港島的香港站，途經九龍站及青衣站，全程約需24分鐘，列車班次每10分鐘一班。香港站及九龍站均設有免費穿梭巴", "facts": [], "level": "neighbors"}, {"gold": false, "path": "到达 > 直升機", "text": "香港國際機場位於赤鱲角，擁有完善的交通配套設施。由機場搭乘列車、公共汽車、計程車和酒店接駁巴士往返市區，車程在約30分鐘之內，而且車資相宜。旅客也可搭乘快速船前往中國內地。機場快綫是來往機場和市區最快速的交通工具。乘客從機場出發，前往香港島的香港站，途經九龍站及青衣站，全程約需24分鐘，列車班次每10分鐘一班。香港站及九龍站均設有免費穿梭巴士服務，接載機場快綫乘客往返車站與各酒店。另外，香港站和九龍站均為旅客免費提供市區預辦登機手續，詳情請向航空公司查詢。計程車站設於機場入境大堂前。香港的計程車分三種顏色，分別行駛於不同地區，但全部均可往返機場。紅色計程車可行駛於香港境內各區（大嶼山的東涌道及南部除外），綠色和藍色的計程車分別只限於新界及大嶼山行駛，不可進入市區。計程車車廂內，貼有詳細的收費表，而車上又有里程表", "facts": [], "level": "neighbors"}, {"gold": false, "path": "市內交通 > 港鐵", "text": "八達通（英語：Octopus Card）是香港通用的電子收費系統於1997年9月1日起使用，透過內置晶片在信用卡大小的塑膠卡片，為卡片增值後放置在接收器上即能夠完成付款過程。八達通最初只應用在巴士、鐵路及渡輪等公共交通工具上，後來陸續地擴展所有公共交通工具上，以至零售業務，後來更普及至在學校、醫院、辦公室及住所等的通行卡。增值方法亦由最初的增值機，擴展至商店 善，覆盖密度是比较大的。但西安郊区的公共自行车服务系统分布不均，只有长安区和临潼区拥有公共自行车服务系统，且集中于区中心。\n\n租车前提，16周岁（含）至70周岁（不含），具有熟练自行车骑行能力的市民凭本人二代身份证和长安通卡，到11个客服网点实名登记个人信息后，签署《公共自行车使用服务协议书》，缴纳300元的诚信保证金，即可开通长安通租车功能。所持长安通卡卡内余额不得少于10元。\n\n", "facts": [], "level": "neighbors"}, {"gold": false, "path": "活动", "text": "华岳仙掌，西岳华山\n雁塔晨钟，小雁塔，最好的时间是春天和秋天，如果不怕冷，也可以冬天去看雪景\n骊山晚照，骊山\n曲江流饮，曲江池\n草堂烟雾，草堂寺，要在深秋或着冬天去看\n灞柳风雪，灞河灞桥\n咸阳古渡，咸阳渭河畔\n太白积雪，太白山\n\n在西安可干的事很多，作为大西北的中心之一，休闲娱乐自不必说，来西安最重要的是体验西安作为古城给人的独特印象。\n\n1 听秦腔。簡介 在钟楼附近西一路上的易俗大剧院能听到。另外环城公园南段，也经常有关于秦腔的表演与活动。\n看皮影戏。簡介 陕西是中国皮影的发源地，陕西皮影也是秦晋皮影的代表，从秦汉盛行至隋唐时代。到西安，去高家大院看一场皮影戏，是最方便的选择。\n西安城墙骑行，地址 西安城墙上的东门、南门、和平门等城门上。🕘 08:00-20:00。💰 单人自行车100分钟以内￥20，双人自行", "facts": [{"ref": "F1", "label": "门票价格", "value": "40", "entity": "西安城墙", "status": "unverified", "written": [], "qualifier": "全年", "verified_at": null}], "level": "neighbors"}, {"gold": false, "path": "交通 > 租车", "text": "与全国许多大城市一样，在西安特定时间打车也不是件容易事，像是在高峰期打出租车就比较困难，打前往火车站的出租车同样比较困难。西安各类出租车由于排量相异，价格也不尽相同。需要注意的是夜间和旅游景点附近一定要乘坐打表的出租车；还有有些交通要道上除了固定的出租车候车点以外是不能停车的，如东大街、南大街、钟楼周边等。每天下午四、五点左右，是西安出租车司机的交接班时间，这个时候较难顺利打到车，在很多节假日，亦会较难顺利打到车。\n西安出租车涂装有三种，天然气动力车是黄绿色涂装，甲醇动力是纯黄色涂装，纯电动车是绿色，并且在出租车顶端有电子显示器，可以显示是否已载客，在车门侧会写着出租车的公司名，游客需注意识别，以防打到黑车。在西安城墙内打车大概需要十元，就可以了，如果要在城墙外市内打车的话12到20元就可以了，有时候出租车不按", "facts": [], "level": "neighbors"}]}}, {"qid": "4e2ec5efc5a2f426", "query": "西安威斯汀酒店在哪", "kind": "answerable", "note": "助手按原文复核；非独立人工标注；住宿 > 城六区酒店 > 高档", "dir": "same", "base": {"rank": 1, "ms": 172, "abstained": false, "judge": null, "judge_reason": null, "evidence": [{"gold": true, "path": "住宿 > 城六区酒店 > 高档", "text": "大体上来说西安的各种类型的酒店众多，游客首选会住在交通方便景点集中的碑林区；其次，雁塔区大小雁塔附近区域也相当不错，交通便利，周围有陕西历史博物馆和大唐芙蓉园等著名景点。如果想要住的经济实惠，西安的多家青年旅舍也是很不错的选择。时间上，西安的住宿一般也不是很紧张，但是在黄金周和旅游旺季时最好提前预订。此外住宿价格在旺季也会有一定幅度的上涨。\n主要住宿地:\n\n钟鼓楼附近（碑林区），即西安市中心，最繁华的商业区。该区域景点较为集中，有西安标志性的钟楼，鼓楼，古城墙，碑林等景点，还有吃货热爱的回民街。火车站也在此区域。该区域各种价位的酒店都很多，交通方便，对于大部分来西安的游客来说是第一选择。如果你是爱热闹的背包客，在南院门附近，集中了一批知名度很高的青年旅舍。如果你喜欢安静的环境，建议选择住在钟楼、鼓楼周边的街区，", "facts": [], "level": "neighbors"}, {"gold": false, "path": "住宿 > 温德姆 > 戴斯", ath": "信息", "text": "Quarry接入队列验收，文档将在后台处理。", "facts": [], "level": "section"}, {"gold": false, "path": "購物 > 金钱", "text": "所有类型和品质的进口俄罗斯商品可从城市周边的旅游商店获得。尤其是伏特加、俄罗斯套娃和巧克力。当地的中国人似乎已经吸收了俄罗斯美食的一些方面，西式面包和香肠都在城里。除此之外，购物与中国其他城市一样。\n\n1 秋林公司（老秋林），地址 果戈里大街361号（地铁博物馆站2号出口或3A出口下车）。簡介 始建于1900年，也为哈尔滨的地标之一。在地下也有最著名的红肠和大列巴（一种俄罗斯面包）。建议尝试多种肠类和面包类食品，同样也不要忘了尝试格瓦斯（一种俄罗斯的液体面包，与布扎、啤酒。可乐并称世界四大民族饮料，哈尔滨的格瓦斯经过本土改良，已与原饮品大相径庭）。\n中央大街主要购物区沿中央大街，防洪纪念塔附近设有沃尔玛，还有果戈里大街的另一个购物区，您可以在那里找到衣服，食物等。沿着这条街是巨大的新购物中心，如欧洲广场、百盛购", "facts": [], "level": "neighbors"}, {"gold": false, "path": "尊重 > 舉止和禮儀", "text": "主張任何地方－－包括香港－－從中國分離，或要求制裁中國或香港政府，在2020年7月1日導入的國安法下，皆屬違法行為，最高可判處終身監禁。任何能引發「對特區政府的憎恨」發言亦屬違法。香港警方偏向寬鬆解釋違法行為的定義，以期使包括所有當局反感的，對政府的批評。殖民地時期的國家安全犯罪－－比如煽動叛亂－－也被視為違反國安法處理。這意味著國安法授權當局行使更廣泛的權力，並可對被告實行更嚴格的保釋要求。\n任何反對中國政府，或是支持2019香港抗議的口號，比如「光復香港，時代革命」、黑紫荊旗、撐香港標語、願榮光歸香港、甚至是聲援中國內地抗議的標語，都會被當局視為煽動與顛覆。對警察的人身攻擊，也會被法庭視為煽動。另外，請盡可能不要展示任何看似普通，但已由香港獨立運動起用的標語或符號。這包括殖民地時期的旗幟，英美國旗與該國國歌", "facts": [], "level": "neighbors"}]}}, {"qid": "24f2e90f29fa40cb", "query": "今天杭州西湖边酒店最低实时成交价是多少？", "kind": "unanswerable", "note": "集合不含此类理论/实时库存；助手标注，非独立人工评测", "dir": "neg", "base": {"rank": null, "ms": 946, "abstained": false, "judge": null, "judge_reason": null, "evidence": [{"gold": false, "path": "住宿", "text": "杭州的夜生活主要在西湖边，可乘坐地铁1号线到龙翔桥站，节假日人会很多。\n\n1 西湖国宾馆（西湖第一名园），地址 西湖区杨公堤18号（靠近曲院风荷及花港观鱼），📞 0571-87979889（咨询） ，免费电话 400 862 8088（预订电话） 。💰 ¥918起。簡介 靠近西湖的一家高档酒店，三面临湖、一面靠山，由广东富商刘学询（1855-1935）始建于1898年，初名水竹居，时人称“西湖刘庄”。1972年2月26日，美国总统尼克松率团在周恩来的陪同下前来杭州访问，下榻在刘庄。中美两国代表基辛格和乔冠华连夜在刘庄内举行会谈，最终于次日凌晨达成一致，在刘庄内的八角亭中草签了《中美上海公报》。2011年，被列为浙江省第六批文物保护单位的近现代重要史迹及代表性建筑之一，它还是2016年的G20峰会期间各国领导人的", "facts": [], "level": "neighbors"}, {"gold": false, "path": "观光 > 杭州西湖文化景观 [页面存档]", "text": "杭州不仅是首批中国最佳旅游城市，中国历史文化名城和八大古都之一，也是中国著名的茶都、丝绸和女装之府。秀美的湖光山色自古以来便吸引了无数人前来观赏，并留下许多文人墨客的赞叹及帝王名人的足迹。\n\n杭州现有西湖、千岛湖（淳安县）、西溪濕地共三个国家5A级旅游景区，以及雷峰塔、清河坊、浙西大峡谷、天目山、大明山 (浙江)|大明山、湘湖、双溪竹海漂流景区、龙门镇 (富阳市)|龙门古镇、杭州野生动物世界、杭州宋城|宋城、杭州乐园、杭州东方文化园等10多处国家4A级旅游景区。\n杭州拥有六和塔、岳飞墓、临安城遗址、胡庆余堂、西泠印社等23处全国重点文物保护单位，以及保俶塔、香 0号。", "facts": [], "level": "neighbors"}, {"gold": false, "path": "学习 > 学习其他的课程", "text": "黑龙江大学成立于延安，原名中国抗日军政大学第三分校俄文队。直到今天黑龙江大学的俄语专业也是与北外不相上下的存在，是在中国学习俄语的首选院校。黑大是中国大陆有自主招生资格的高校中唯二的双非（非985，非211），另一个是西南政法大学。\n\n如果你的中文好，你可以报名参加哈尔滨的大部分学校。许多巴基斯坦的学生在哈尔滨医科大学学习医学。学费很便宜。1926年建校的哈尔滨医科大学是哈尔滨现存的历史第二久远的大学（第一是哈工大），其前身是东北防疫总处，曾经是中国最先进的卫生研究机构，汇集了大批哈佛，牛津等世界名校的归国留学生，立校后的首任校长就是剑桥大学毕业的伍连德，在当时是中国首屈一指的科学家，时人称国士无双，候选诺贝尔奖，创建中华医学会等等。梁启超曾评价“科学输入垂三十载，国中能以学者身份与世界见者，伍星联博士一人而已", "facts": [], "level": "neighbors"}]}, "new": {"rank": null, "ms": 370, "abstained": true, "judge": null, "judge_reason": null, "evidence": [{"gold": false, "path": "学习 > 图书馆 > 高等院校图书馆", "text": "本节列出了青岛市域范围内的图书馆，游客或许可以在此找到有关青岛当地的旅行、历史和地理相关的书籍，青岛市所有公共图书馆可通借通还。\n\n青岛市图书馆，地址 市南区延吉路109号。🕘 08:30-17:30（05月1日-09月30日），08:30-17:00（10月1日-04月30日）。簡介 国家一级图书馆。 (更新日期：2019年7月)\n市南区图书馆，地址 市南区大尧三路19号。🕘 09:00-17:30（一、二、三、五、六、日），13:30-17:30（四），周四上午闭馆。簡介 国家一级图书馆。 (更新日期：2019年7月)\n市北第一图书馆（原市北区图书馆），地址 市北区昌邑路2号。🕘 09:00-17:00（一、二、三、五、六、日），周四全天闭馆。簡介 国家一级图书馆。 (更新日期：2019年7月)\n市北第二图", "facts": [], "level": "neighbors"}, {"gold": false, "path": "了解 > 氣候", "text": "在黃山國家公園總共發現了1450多種植物。最為奇特的是黃山松，這種松樹是從堅硬的花崗岩石里長出來的，並且緊貼著花崗岩石。人們根據它們的不同的形態和神韻，分別給它們起了貼切的自然而又典雅有趣的名字，如迎客松、黑虎松、臥龍松、龍爪松、探海松、團結松等。有記錄的動物大約有470種。地面上經常看到的是松鼠和小蜥蜴。\n\n夜間寒冷，（海拔1800米）。冬天道路結冰，非常危險。\n\n黄山机场，位于黄山市屯溪区，有往返北京、上海、重庆、广州、合肥、天津、海口、深圳、福州、杭州、武汉、西安、桂林、昆明、厦门、珠海、长沙、济南、香港、澳门等城市的航班。\n由黄山机场前往黄山风景区，可先乘坐公车或出租车到屯溪汽车站，然后坐开往黄山景区的汽车。", "facts": [], "level": "neighbors"}, {"gold": false, "path": "信息", "text": "Quarry接入队列验收，文档将在后台处理。", "facts": [], "level": "section"}]}}, {"qid": "8522f4681a28604e", "query": "家用冰箱压缩机电路怎样连接？", "kind": "unanswerable", "note": "集合不含此类理论/实时库存；助手标注，非独立人工评测", "dir": "neg", "base": {"rank": null, "ms": 197, "abstained": true, "judge": null, "judge_reason": null, "evidence": [{"gold": false, "path": "周游 > 地铁", "text": "地图: 在中国大陆，Google 地图被屏蔽，且即使翻墙数据也严重过时。Apple Maps 在大多数主干道无需翻墙可用；地铁与步行建议使用 高德地图 Amap（支持英文界面）。建议行前下载好离线地图。\n支付: 现金仍可用但越来越少见。乘地铁、在街边小店买 SIM 卡、或在小饭馆 AA 付款，都需要 支付宝或微信支付绑定外卡 V $("metrics").innerHTML = D.metrics.map(m => `<div class="metric">
  <div class="name">${esc(m.name)}</div>
  <div class="line"><span class="val">${esc(m.new)}</span><span class="delta ${m.dir}">${esc(m.delta)}</span></div>
  <div class="bar"><i class="was" style="width:${m.bar_base}%"></i><i style="width:${m.bar_new}%"></i></div>
</div>`).join("");
$("gate").className = "gate " + (D.gate.ok ? "pass" : "fail");
$("gate").innerHTML = D.gate.ok
  ? `回归闸门：✅ 通过<span>召回率、正确拒答率、证据支撑率都没有掉出阈值</span>`
  : `回归闸门：❌ 不通过<span>${D.gate.problems.map(esc).join("；")}</span>`;
$("foot").innerHTML = `基线配置 ${esc(D.base.config_text)}<br>对照配置 ${esc(D.new.config_text)}<br>`
  + `名次轨道：空心点是基线名次，实心点是对照名次，最右一格表示金块没进前 ${D.top_k} 条。`;

const FILTERS = [
  { id: "all", name: "全部", test: () => true },
  { id: "up", name: "变好", test: i => i.dir === "up" },
  { id: "down", name: "变坏", test: i => i.dir === "down" },
  { id: "miss", name: "未命中", test: i => i.kind === "answerable" && i.new.rank === null },
  { id: "judge", name: "裁判存疑", test: i => i.new.judge && i.new.judge !== "supported" },
  { id: "neg", name: "无答案", test: i => i.kind === "unanswerable" }
];

function track(item) {
  const W = 176, H = 20, pad = 9, slots = D.top_k + 1, span = (W - pad * 2) / slots;
  const x = r => pad + ((r === null ? D.top_k : r - 1) + .5) * span;
  if (item.kind === "unanswerable")
    return `<svg class="track" viewBox="0 0 ${W} ${H}"><text x="${pad}" y="14" font-size="11" fill="var(--muted)">${item.new.abstained ? "建议拒答" : "没有拒答"}</text></svg>`;
  const color = item.dir === "up" ? "var(--up)" : item.dir === "down" ? "var(--down)" : "var(--muted)";
  const ticks = Array.from({ length: slots }, (_, i) =>
    `<circle cx="${x(i === D.top_k ? null : i + 1)}" cy="10" r="1" fill="var(--rule)"/>`).join("");
  return `<svg class="track" viewBox="0 0 ${W} ${H}" role="img" aria-label="基线 ${item.base.rank ?? "未命中"}，对照 ${item.new.rank ?? "未命中"}">
    <line x1="${pad}" y1="10" x2="${W - pad}" y2="10" stroke="var(--rule)"/>${ticks}
    <line x1="${x(item.base.rank)}" y1="10" x2="${x(item.new.rank)}" y2="10" stroke="${color}" stroke-width="2.5"/>
    <circle cx="${x(item.base.rank)}" cy="10" r="4" fill="var(--surface)" stroke="${color}" stroke-width="1.5"/>
    <circle cx="${x(item.new.rank)}" cy="10" r="4.5" fill="${color}"/></svg>`;
}

function renderFilters() {
  $("filters").innerHTML = FILTERS.map(f =>
    `<button class="chip" aria-pressed="${filter === f.id}" data-f="${f.id}">${f.name}<span class="n">${D.items.filter(f.test).length}</span></button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.f; renderFilters(); renderRows(); });
}

function renderRows() {
  const rows = D.items.filter(FILTERS.find(f => f.id === filter).test);
  $("rows").innerHTML = rows.length ? rows.map(i => `<button class="row" aria-selected="${selected === i.qid}" data-id="${i.qid}">
      <span class="q"><span class="text">${esc(i.query)}</span><span class="path">${esc(i.note || "语料里没有对应内容")}</span></span>
      ${track(i)}
      <span class="verdict-cell">${i.new.judge ? `<span class="verdict v-${i.new.judge}">${i.new.judge}</span>` : `<span class="verdict v-none">—</span>`}</span>
      <span class="ms">${i.new.ms}</span>
    </button>`).join("") : `<div class="empty">这个筛选下没有问题。</div>`;
  $("rows").querySelectorAll(".row").forEach(r => r.onclick = () => { selected = r.dataset.id; renderRows(); renderDetail(); });
}

function runBlock(item, side) {
  const run = D[side], r = item[side];
  const head = item.kind === "unanswerable"
    ? (r.abstained ? "建议拒答" : "没有拒答")
    : (r.rank ? `金块第 ${r.rank} 条` : `金块未进前 ${D.top_k}`);
  const evs = r.evidence.length ? r.evidence.map((e, n) => `<div class="ev ${e.gold ? "gold" : ""}">
      <div class="meta"><span>第 ${n + 1} 条</span><span>${esc(e.path)}</span><span>${esc(e.level)}</span>${e.gold ? "<span>金块</span>" : ""}</div>
      <div class="snippet">${mark(e.text)}</div>
      ${e.facts.length ? `<div class="facts">${e.facts.map(f => `<div class="fact"><span class="dot d-${f.status}"></span><span>${esc(f.ref)} ${esc(f.entity)} ${esc(f.label)}·${esc(f.qualifier)} = <b>${esc(f.value)}</b> ${f.verified_at ? "核实于 " + esc(f.verified_at) : "未核实"}${f.written.length ? `<span class="old">（正文写的是 ${esc(f.written.join("、"))}）</span>` : ""}</span></div>`).join("")}</div>` : ""}
    </div>`).join("") : `<div class="ev"><div class="snippet">没有返回证据。</div></div>`;
  return `<div class="run-block">
    <div class="run-name"><span>${esc(run.label)}</span><span>${head} · ${r.ms} ms</span></div>
    ${evs}
    ${r.judge ? `<div class="judge-box">裁判：<span class="verdict v-${r.judge}">${r.judge}</span> ${esc(r.judge_reason || "")}</div>` : ""}
  </div>`;
}

function renderDetail() {
  const item = D.items.find(i => i.qid === selected);
  $("detail").innerHTML = item
    ? `<h2>${esc(item.query)}</h2><div class="gold">${item.note ? "金块：" + esc(item.note) : "无答案问题"}</div>${runBlock(item, "base")}${runBlock(item, "new")}`
    : `<div class="empty">选一道题，看看两次运行分别返回了什么证据。<br><br>先看"变坏"里的几条：多数时候不是检索退步，而是另一个块其实也能答。</div>`;
}

renderFilters(); renderRows(); renderDetail();
</script>
</body>
</html>
